[project]
name = "food-recall"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = []

[tool.unittest]
start-directory = "tests"

[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["food_recall", "food_recall.fixtures"]

[tool.setuptools.package-dir]
"food_recall.fixtures" = "fixtures"

[tool.setuptools.package-data]
"food_recall.fixtures" = ["*.json"]
